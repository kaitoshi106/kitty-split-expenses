# Production stack for a VPS or for a local run before deploying.
#
#   docker compose -f docker-compose.prod.yml up --build
#
# `name` must differ from the dev project: compose defaults the project name to
# the directory, so without it `up` would replace the dev database container.
name: splid-prod

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-kitty}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      POSTGRES_DB: ${DATABASE_NAME:-kitty}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DATABASE_USER:-kitty}']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    # Wait until Postgres accepts connections, otherwise migrations fail on boot.
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      SERVE_STATIC: 'true'
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_USER: ${DATABASE_USER:-kitty}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
      DATABASE_NAME: ${DATABASE_NAME:-kitty}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-30d}
    ports:
      - '${APP_PORT:-8080}:3000'
    volumes:
      # Receipt uploads persist across deploys.
      - uploads:/data/uploads

volumes:
  pgdata:
  uploads:
